  hidden_assumptions:
  - id: integer_scaling
    kind: modeling
    lean: '∀ n : ℕ, 0 < n → ∀ X ∈ PosOrthant, S ((n : ℝ) • X) = n * S X'
    justification: source_implied
    note: The exercise asks for homogeneity 'from the postulate' (additivity, the extremum principle,
      and Remark 1.1's identical systems sharing one entropy function) without saying how. The step 'n
      identical copies merged into one system have entropy n·S(X)' is never stated; we assume it directly.
  - id: continuity
    kind: regularity
    lean: ContinuousOn S PosOrthant
    justification: source_stated
    note: 'Borderline: the postulate states differentiability, which implies this. Listed because the
      source''s hint (''consider first λ ∈ ℚ'') silently needs it to pass from rational to real λ.'
  - id: positive_orthant
    kind: domain
    lean: PosOrthant
    justification: encoding_artifact
    note: The source does not name S's domain; we take U, V, N > 0.
